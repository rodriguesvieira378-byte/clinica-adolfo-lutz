<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Médica Adolfo Lutz | Sistema de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f3557;--navy2:#174a72;--teal:#1d8b86;--teal2:#14726e;--bg:#f2f6f9;--line:#dbe5ec;--muted:#5f7386;--text:#15304a;--warn:#a46c17;--bad:#a73b3b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:262px;flex-shrink:0;background:linear-gradient(170deg,#0b2c4a,#124a70);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.logo-card{background:#fff;border-radius:16px;padding:10px 12px;display:block;box-shadow:0 6px 20px #00000030}
.logo-card img{width:100%;display:block}
.nav{padding-top:18px;display:grid;gap:3px}
.nav .group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9cc2d6;padding:12px 12px 4px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#d8e9f2;padding:10px 12px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button.active,.nav button:hover{background:#ffffff1f;color:#fff}
.sidefoot{margin-top:auto;padding:16px 10px 4px;font-size:11px;color:#b4d0de;line-height:1.6}
.main{min-width:0;flex:1}
.top{background:#fff;padding:18px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:3}
.top h1{font-size:21px;margin:0}
.top p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.status{display:inline-flex;align-items:center;gap:7px;border-radius:50px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap;border:0;background:#eef3f7;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.status.cloud{background:#e3f4f1;color:#12776f}
.status.local{background:#fff3de;color:var(--warn)}
.status.err{background:#fff0f0;color:var(--bad)}
.content{padding:26px 30px 40px;max-width:1400px;margin:auto}
.hero{border-radius:18px;background:linear-gradient(110deg,#0f3557,#1a6f86);color:#fff;padding:28px;display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:22px}
.hero h2{margin:0 0 8px;font-family:"Playfair Display",Georgia,serif;font-size:27px}
.hero p{margin:0;color:#d5e8f0;line-height:1.6;max-width:620px}
.hero .heroimg{background:#fff;border-radius:14px;padding:8px;width:190px;flex-shrink:0}
.hero .heroimg img{width:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 12px #17324b08}
.stat{padding:18px}
.stat span{font-size:12.5px;color:var(--muted)}
.stat strong{display:block;font-size:30px;margin-top:6px;color:var(--navy)}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--teal);margin-top:4px}
.panel{padding:20px;margin-bottom:20px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.panel h2{font-size:17px;margin:0}
.panel h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.primary{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:700}
.primary:hover{background:var(--teal2)}
.primary:disabled{opacity:.6;cursor:default}
.secondary{background:#edf4f8;color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600}
.secondary:hover{background:#e2edf4}
.danger{color:var(--bad);background:#fff0f0;border:1px solid #f0d0d0;border-radius:8px;padding:8px 12px;font-weight:600}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.search{border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:300px;max-width:100%;outline-color:var(--teal);background:#fff}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11.5px;color:var(--muted);background:#f6f9fb;padding:12px;font-weight:700;white-space:nowrap}
td{border-top:1px solid #edf1f5;padding:11px 12px;font-size:13px;vertical-align:middle}
td button{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pill{display:inline-block;background:#eaf4fa;color:#1a6388;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.good{background:#e5f6ef;color:#16815d}
.pill.warn{background:#fff3de;color:var(--warn)}
.pill.bad{background:#fff0f0;color:var(--bad)}
.empty{padding:24px;color:var(--muted);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:#38516a}
.field small{font-size:11px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid #cfdee8;border-radius:9px;padding:10px;background:#fff}
.field input[readonly]{background:#f3f6f8;color:var(--muted)}
.field textarea{min-height:76px;resize:vertical}
.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.formerror{display:none;background:#fff0f0;border:1px solid #f0d0d0;color:var(--bad);border-radius:9px;padding:10px 12px;font-size:13px;margin-top:14px}
.formerror.show{display:block}
.modalback{position:fixed;inset:0;background:#0a253b99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalback.open{display:flex}
.modal{width:min(700px,100%);background:#fff;border-radius:17px;padding:24px;max-height:92vh;overflow:auto}
.modal.small{width:min(430px,100%)}
.modal h2{margin:0;font-size:19px}
.notice{background:#fff8e9;border:1px solid #f2dfb4;color:#765c26;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.6;margin-top:16px}
.notice.info{background:#eef6fb;border-color:#cfe3ef;color:#24577a}
.smallcard{padding:16px;background:#f5f9fb;border-radius:12px;border:1px solid var(--line)}
.smallcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.smallcard strong{color:var(--navy)}
.toast{position:fixed;bottom:22px;right:22px;background:#173e58;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 10px 30px #0003;display:none;z-index:30;max-width:420px}
.toast.show{display:block}
.toast.bad{background:#8f2f2f}
.reminder{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #edf1f5}
.reminder:first-child{border-top:0}
.login{max-width:420px;margin:10px auto}
#authView{display:none}
body.auth #authView{display:flex}
body.auth .layout{display:none}
.authwrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:linear-gradient(160deg,#0b2c4a,#124a70 55%,#1d8b86)}
.authcard{background:#fff;border-radius:20px;box-shadow:0 24px 60px #0008;width:100%;max-width:430px;padding:28px 28px 22px}
.authcard .authlogo{display:block;width:190px;margin:0 auto 14px}
.authcard h2{text-align:center;margin:0 0 4px;color:var(--navy);font-size:21px}
.authcard .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px}
.authcard .field{margin-top:12px}
.authcard .primary{width:100%;margin-top:18px;padding:12px}
.demo{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.demo b{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.demo button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#f6f9fb;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:6px;font-size:12.5px;color:var(--text);cursor:pointer}
.demo button:hover{border-color:var(--teal)}
.demo button span{color:var(--muted)}
.demo button em{font-style:normal;font-weight:700;color:var(--teal)}
.authfoot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.5}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.userbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.userbox b{color:var(--navy)}
.userbox .role{background:#e3f4f1;color:#12776f;border-radius:50px;padding:4px 9px;font-weight:700;font-size:11.5px}
.dbtable{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dbtable div{background:#f5f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-size:13px}
.dbtable b{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip span{opacity:.75;margin-left:4px}
.track{display:grid;gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 3px 12px #17324b08}
.tcard.late{border-color:#f0d0d0}
.thead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.thead h3{margin:0;font-size:15px}
.thead p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);margin:18px 0 4px}
.step{text-align:center;position:relative;padding:0 4px}
.step .dot{width:28px;height:28px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#e6edf2;color:#8aa0b2;font-size:12px;font-weight:800;position:relative;z-index:1;border:3px solid #fff}
.step::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#e6edf2}
.step:first-child::before{display:none}
.step.done .dot{background:var(--teal);color:#fff}
.step.done::before,.step.now::before{background:var(--teal)}
.step.now .dot{background:#fff;border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px #1d8b8622}
.step b{display:block;font-size:12px;margin-top:7px;color:var(--text)}
.step small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
.step.todo b{color:#8aa0b2}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #edf1f5;font-size:12.5px;color:var(--muted)}
.cancel{background:#fff0f0;color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:13px;font-weight:600}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
 .layout{display:block}
 .sidebar{width:100%;height:auto;position:static;padding:12px;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
 .logo-card{width:150px;padding:6px 8px;border-radius:12px}
 .nav{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:0;width:100%;gap:6px}
 .nav .group{display:none}
 .nav button{white-space:nowrap;width:auto;background:#ffffff14;font-size:13px;padding:9px 12px}
 .sidefoot{display:none}
 .top{position:static;padding:14px 18px}
 .content{padding:18px}
 .grid2,.grid3,.dbtable{grid-template-columns:1fr}
 .hero .heroimg{display:none}
}
@media(max-width:600px){
 .demo button{flex-direction:column;align-items:flex-start;gap:2px}
 .authcard{padding:22px 18px 18px}
 .userbox b{display:none}
 .stats{grid-template-columns:repeat(2,1fr)}
 .formgrid{grid-template-columns:1fr}
 .field.wide{grid-column:auto}
 .top{flex-wrap:wrap}
 .top h1{font-size:18px}
 .hero{padding:20px}.hero h2{font-size:22px}
 .panel{padding:14px}
 .panelhead .search{width:100%}
 .panelhead .primary{width:100%}
 table,tbody{display:block}
 thead{display:none}
 tbody tr{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:0 0 10px}
 tbody td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;border-bottom:1px solid #eef2f5;padding:9px 2px;overflow-wrap:anywhere;text-align:right}
 tbody td:last-child{border-bottom:0}
 tbody td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left;flex:0 0 40%}
 tbody td.empty{display:block;text-align:center}
 tbody td.empty::before{display:none}
 .actions{justify-content:flex-end}
 .modalback{padding:0;align-items:flex-end}
 .modal{border-radius:16px 16px 0 0;max-height:94dvh;padding:16px}
 .formactions{position:sticky;bottom:-16px;background:#fff;padding:10px 0}
 .formactions button{flex:1}
 .steps{grid-template-columns:1fr;gap:0;margin:14px 0 0}
 .step{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:0 0 14px}
 .step .dot{margin:0;flex-shrink:0}
 .step::before{top:-14px;left:13px;width:3px;height:28px}
 .step b{margin-top:4px}
 .step > div{min-width:0}
 .toast{left:12px;right:12px;bottom:12px;text-align:center;max-width:none}
}
</style>
</head>

async function sha256(text){
 try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(''); }
 catch { return null; }
}

/* ===== Camada de banco de dados ===== */
function normalize(t, row, docId){
 const r = {}; COLUMNS[t].forEach(c => r[c] = row[c] ?? null);
 if (r[PK[t]] == null) r[PK[t]] = t === 'PACIENTE' ? docId : Number(docId);
 return r;
}
function loadLocal(){
 let stored = null;
 try { stored = JSON.parse(localStorage.getItem(LOCAL_KEY)); } catch {}
 const src = stored && typeof stored === 'object' ? stored : JSON.parse(JSON.stringify(SEED));
 TABLES.forEach(t => data[t] = Array.isArray(src[t]) ? src[t].map(r => normalize(t, r, r[PK[t]])) : []);
}
function persistLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch { notify('O navegador não deixou salvar os dados localmente.', true); } }
function dbErrorMessage(e){
 const code = e && e.code;
 if (code === 'invalid_argument') { readOnly = true; return 'Você não tem permissão para alterar o banco. Peça ao dono do site acesso de Contribuidor ou Editor.'; }
 if (code === 'quota_exceeded') return 'O banco de dados atingiu o limite de registros. Exclua registros antigos.';
 if (code === 'resource_exhausted') return 'Muitas operações seguidas. Aguarde alguns segundos e tente de novo.';
 if (code === 'revoked') return 'O acesso a este site foi alterado. Recarregue a página.';
 return 'Não foi possível falar com o banco de dados agora. Tente de novo.';
}
async function writeRow(t, row){
 const r = normalize(t, row, row[PK[t]]);
 if (mode === 'cloud') {
  const ref = cloud.collection(t).doc(String(r[PK[t]]));
  try { await ref.set(r); }
  catch (e) { if (e && e.code === 'unavailable') { await new Promise(s => setTimeout(s, 400 + Math.random()*600)); await ref.set(r); } else throw e; }
 } else {
  const i = data[t].findIndex(x => String(x[PK[t]]) === String(r[PK[t]]));
  if (i >= 0) data[t][i] = r; else data[t].push(r);
  persistLocal();
 }
}
async function deleteRow(t, id){
 if (mode === 'cloud') await cloud.collection(t).doc(String(id)).delete();
 else { data[t] = data[t].filter(x => String(x[PK[t]]) !== String(id)); persistLocal(); }
}
let renderQueued = false;
function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

async function init(){
 route(); render();
 let dbns = null;
 try { if (window.claude && typeof window.claude.use === 'function') dbns = await window.claude.use('db'); } catch {}
 if (!dbns) { mode = 'local'; loadLocal(); render(); return; }
 cloud = dbns; mode = 'cloud';
 try { userCap = await window.claude.use('user'); } catch {}
 try { const w = userCap && await userCap.can('data.write'); if (w === false) readOnly = true; } catch {}
 const pending = new Set(TABLES);
 const timer = setTimeout(() => { if (pending.size) { connNote = 'lento'; scheduleRender(); } }, 10000);
 TABLES.forEach(t => {
  cloud.collection(t).onSnapshot(snap => {
   data[t] = snap.docs.map(d => normalize(t, d.data() || {}, d.id));
   if (!snap.metadata.fromCache && pending.delete(t) && !pending.size) { clearTimeout(timer); connNote = ''; }
   scheduleRender();
  }, err => {
   pending.delete(t); if (!pending.size) clearTimeout(timer);
   connNote = 'erro'; if (err && err.code === 'revoked') readOnly = true; scheduleRender();
  });
 });
 render();
}

}

function navHtml(){
 const out = []; let group = null;
 for (const s of SECTIONS) {
  if (s.length === 1) { group = s[0]; continue; }
  if (!allowed(s[0])) continue;
  if (group) { out.push(`<div class="group">${group}</div>`); group = null; }

function table(head, rows){
 const body = rows.length ? rows.map(cells => '<tr>' + cells.map((c,i) => `<td data-label="${esc(head[i])}">${c}</td>`).join('') + '</tr>').join('')
  : `<tr><td colspan="${head.length}" class="empty">Nenhum registro encontrado.</td></tr>`;
 return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function listing(t){
 const cfg = CFG[t], q = searchTerm.trim().toLowerCase();
 let rows = data[t].slice();
 if (cfg.sort) rows.sort(cfg.sort);
 const cells = rows.map(r => [...cfg.cols.map(c => c[1](r)), rowActions(t, r[PK[t]])]);
 const filtered = q ? cells.filter(c => c.slice(0,-1).join(' ').replace(/<[^>]+>/g,' ').toLowerCase().includes(q)) : cells;
 const novo = (cfg.fem ? 'Nova ' : 'Novo ') + cfg.sing;
 let extra = '';
 if (t === 'RESULTADO_EXAME') extra = '<div class="notice info">Ao registrar um resultado, a situação do exame muda sozinha para "Resultado disponível". O PDF é representado pelo nome do arquivo: o site não guarda arquivos e não recebe resultados de laboratórios.</div>';
 if (t === 'USUARIO') extra = '<div class="notice info">A senha nunca é guardada em texto puro: o banco recebe apenas o hash (coluna SENHA_HASH). Em um sistema real usaríamos um algoritmo próprio para senhas, como bcrypt, no servidor.</div>';
 if (t === 'EXAME') extra = '<div class="notice info">Regras aplicadas: a coleta exige o pedido médico quando o tipo de exame pede; o encaminhamento exige o laboratório e não pode ser anterior à coleta.</div>';
 return `<div class="panel"><div class="panelhead"><div><h2>${PAGES[current].title}</h2><p class="muted" style="margin:4px 0 0">${data[t].length} registro(s) na tabela <span class="mono">${t}</span></p></div>
  ${canEdit(t) ? `<button class="primary" onclick="openForm('${t}')">+ ${novo}</button>` : `<span class="pill">Somente consulta</span>`}</div>
  <div style="margin-bottom:16px"><input class="search" id="search" placeholder="Pesquisar…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"></div>

}
function rowActions(t, id){
 const sid = esc(JSON.stringify(String(id)));
 const pdf = t === 'RESULTADO_EXAME' ? `<button class="primary" onclick="baixarLaudo(${Number(find(t,id)?.EXAME_ID)})">📄 PDF</button>` : '';
 if (!canEdit(t)) return pdf ? `<div class="actions">${pdf}</div>` : '<span class="muted">Somente consulta</span>';
 return `<div class="actions">${pdf}<button class="secondary" onclick="openForm('${t}',${sid})">Editar</button><button class="danger" onclick="removeRow('${t}',${sid})">Excluir</button></div>`;
}

let LOGO_JPG = ''; const LOGO_W = 360, LOGO_H = 295;
function prepLogoJpg(){ const im = new Image(); im.onload = () => { try { const cv = document.createElement('canvas'); cv.width = LOGO_W; cv.height = LOGO_H; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, LOGO_W, LOGO_H); g.drawImage(im, 0, 0, LOGO_W, LOGO_H); LOGO_JPG = cv.toDataURL('image/jpeg', 0.9).split(',')[1]; } catch {} }; const el = document.querySelector('.logo-card img'); if (el) im.src = el.src; }
window.addEventListener('load', prepLogoJpg);
function seededRand(seed){ let s = (seed * 2654435761) % 4294967296; return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }
function analitos(tipoNome, exameId){
 const r = seededRand(exameId + 7); const n = (a, b, d = 0) => (a + r() * (b - a)).toFixed(d).replace('.', ',');
 const t = (tipoNome || '').toLowerCase();
 if (t.includes('hemograma')) return [
  ['Hemácias', n(4.6, 5.6, 2), 'milhões/µL', '4,50 a 5,90'], ['Hemoglobina', n(13.8, 16.5, 1), 'g/dL', '13,5 a 17,5'],
  ['Hematócrito', n(41, 49, 1), '%', '41,0 a 53,0'], ['Leucócitos', String(Math.round(5000 + r() * 4500)), '/mm³', '4.000 a 11.000'],
  ['Plaquetas', String(Math.round(180 + r() * 220)), 'mil/mm³', '150 a 450']];
 if (t.includes('glicemia') || t.includes('glicose')) return [['Glicose em jejum', n(74, 96), 'mg/dL', '70 a 99']];
 if (t.includes('colesterol')) return [
  ['Colesterol total', n(150, 185), 'mg/dL', 'menor que 190'], ['HDL colesterol', n(45, 65), 'mg/dL', 'maior que 40'],
  ['LDL colesterol', n(80, 125), 'mg/dL', 'menor que 130'], ['Triglicerídeos', n(70, 140), 'mg/dL', 'menor que 150']];
 if (t.includes('urina') || t.includes('eas')) return [
  ['Cor', 'Amarelo citrino', '', 'Amarelo citrino'], ['Aspecto', 'Límpido', '', 'Límpido'], ['Densidade', n(1.010, 1.025, 3), '', '1,005 a 1,030'],
  ['pH', n(5.5, 6.5, 1), '', '5,0 a 7,0'], ['Proteínas', 'Negativo', '', 'Negativo'], ['Glicose', 'Negativo', '', 'Negativo'], ['Leucócitos', String(Math.round(1 + r() * 3)), '/campo', 'até 5']];
 return [['Resultado', 'Dentro da normalidade', '', '—']];
}
function pdfText(s){ // texto -> bytes WinAnsi escapados para PDF
 const map = {'–':0x96,'—':0x97,'•':0x95,'“':0x93,'”':0x94,'‘':0x91,'’':0x92,'…':0x85};
 let o = '';
 for (const ch of String(s)) { let c = map[ch] ?? ch.charCodeAt(0); if (c > 255) c = 63; const x = String.fromCharCode(c); o += (x === '(' || x === ')' || x === '\\') ? '\\' + x : x; }
 return o;
}
function gerarLaudoPdf(exameId){

 // cabeçalho
 const lw = 92, lh = Math.round(lw * LOGO_H / LOGO_W);
 c.push(`q ${lw} 0 0 ${lh} ${M} ${H - 52 - lh} cm /Im1 Do Q`);
 txt(M + lw + 16, H - 78, 'CLÍNICA MÉDICA ADOLFO LUTZ', 17, true);

 txt(M + lw + 16, H - 118, 'LAUDO DE EXAME LABORATORIAL', 12, true, '0.11 0.55 0.53');

 rect(M, y, W - 2 * M, 2, '0.11 0.55 0.53');
 // dados

 campos.forEach(([k, v], i) => { const col = i % 2, row = Math.floor(i / 2); const x = M + col * 262, yy = y - row * 30;
  txt(x, yy, k.toUpperCase(), 7.5, true, '0.38 0.46 0.53'); txt(x, yy - 12, v, 10.5, false); });
 y -= Math.ceil(campos.length / 2) * 30 + 14;
 // tabela
 rect(M, y - 6, W - 2 * M, 22, '0.06 0.21 0.34');
 const X = [M + 10, M + 190, M + 300, M + 380];
 ['ANALITO', 'RESULTADO', 'UNIDADE', 'VALORES DE REFERÊNCIA'].forEach((h, i) => txt(X[i], y + 1, h, 8.5, true, '1 1 1'));

  y -= 22; });
 line(M, y + 12, W - M, y + 12);
 y -= 14;
 if (res.OBSERVACAO) { txt(M, y, 'Observação:', 9.5, true); txt(M + 64, y, res.OBSERVACAO, 9.5); y -= 18; }
 // rodapé
 line(M, 66, W - M, 66);
 txt(M, 52, 'Gerado em ' + fmtDT(nowLocal()) + ' pelo sistema acadêmico da Clínica Médica Adolfo Lutz. Sem validade médica.', 7.5, false, '0.55 0.6 0.65');
 const stream = c.join('\n');
 const img = atob(LOGO_JPG);
 const objs = [
  '<< /Type /Catalog /Pages 2 0 R >>',
  '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
  `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> /XObject << /Im1 6 0 R >> >> /Contents 7 0 R >>`,
  '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',

  `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,
  `<< /Title (${pdfText('Laudo ' + res.ARQUIVO_PDF)}) /Producer (${pdfText('Sistema Clinica Adolfo Lutz - academico')}) >>`];
 let out = '%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'; const off = [];
 objs.forEach((o, i) => { off.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
 const xref = out.length;
 out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');

 const bytes = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
 return { bytes, nome: /\.pdf$/i.test(res.ARQUIVO_PDF) ? res.ARQUIVO_PDF : res.ARQUIVO_PDF + '.pdf' };
}

const STAGE = {'Agendado':0,'Aguardando coleta':0,'Coletado':1,'Enviado ao laboratório':2,'Em análise':3,'Resultado disponível':4};

function trackCard(e, admin){

  if (locked) ctrl += `<input type="hidden" name="${f.k}" value="${esc(val)}">`;

  ctrl = `<select name="${f.k}" ${req}>${f.opts.map(o=>`<option ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

   if (r.JUSTIFICATIVA_FALTA && r.SITUACAO !== 'Não compareceu') return 'A justificativa de falta só vale para a situação "Não compareceu".';
   return null;
  }
  case 'EXAME': {

   const posColeta = ['Coletado','Enviado ao laboratório','Em análise','Resultado disponível'];
   const posEnvio = ['Enviado ao laboratório','Em análise','Resultado disponível'];
   if (tipo && Number(tipo.EXIGE_PEDIDO_MEDICO) === 1 && Number(r.PEDIDO_MEDICO_APRESENTADO) !== 1 && (r.DATA_COLETA || posColeta.includes(r.SITUACAO))) return 'Este tipo de exame exige pedido médico antes da coleta.';
   if (posColeta.includes(r.SITUACAO) && !r.DATA_COLETA) return 'Informe a data da coleta.';
   if (posEnvio.includes(r.SITUACAO) && !r.DATA_ENCAMINHAMENTO) return 'Informe a data do encaminhamento ao laboratório.';
   if ((r.DATA_ENCAMINHAMENTO || posEnvio.includes(r.SITUACAO)) && !r.LABORATORIO_ID) return 'Informe o laboratório responsável pelo encaminhamento.';
   if (r.DATA_ENCAMINHAMENTO && !r.DATA_COLETA) return 'Não há encaminhamento sem coleta: informe a data da coleta.';
   if (r.DATA_COLETA && r.DATA_ENCAMINHAMENTO && r.DATA_ENCAMINHAMENTO < r.DATA_COLETA) return 'O encaminhamento não pode ser antes da coleta.';
   if (r.PREVISAO_ENTREGA && r.DATA_COLETA && r.PREVISAO_ENTREGA < r.DATA_COLETA) return 'A previsão do resultado não pode ser antes da coleta.';
   const temRes = old && resultOf(old.EXAME_ID);
   if (r.SITUACAO === 'Resultado disponível' && !temRes) return 'Para marcar "Resultado disponível", registre o resultado na tela Resultados (a situação muda sozinha).';
   if (temRes && r.SITUACAO !== 'Resultado disponível') return 'Este exame já tem resultado liberado. Exclua o resultado antes de mudar a situação.';
   return null;
  }
  case 'RESULTADO_EXAME':
   if (!old && resultOf(r.EXAME_ID)) return 'Este exame já tem resultado (é permitido apenas um resultado por exame).';
   if (!/\.pdf$/i.test(r.ARQUIVO_PDF || '')) return 'O nome do arquivo precisa terminar em .pdf';
   return null;
 }
 return null;
}
$('entityForm').addEventListener('submit', async e => {
 e.preventDefault();
 if (!editing) return;
 const {t, id} = editing, old = id != null ? find(t, id) : null;
 const r = readForm(t);
 const err = validate(t, r, old);
 if (err) { formError(err); return; }
 const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Salvando…';
 try {
  const row = Object.assign({}, old || {}, r);
  if (!old) row[PK[t]] = t === 'PACIENTE' ? r.PACIENTE_CPF : nextId(t);
  if (t === 'USUARIO') {
   if (r.SENHA) { const h = await sha256(r.SENHA); if (!h) throw {code:'hash'}; row.SENHA_HASH = h; }
   delete row.SENHA;
   if (!old) row.DATA_CADASTRO = nowLocal();
  }
  await writeRow(t, row);
  if (t === 'RESULTADO_EXAME') {
   const ex = find('EXAME', row.EXAME_ID);
   if (ex && ex.SITUACAO !== 'Resultado disponível') await writeRow('EXAME', Object.assign({}, ex, {SITUACAO:'Resultado disponível'}));
  }
  closeForm(); render(); notify('Registro salvo com sucesso.');
 } catch (ex) {
  btn.disabled = false; btn.textContent = 'Salvar registro';
  formError(ex && ex.code === 'hash' ? 'Este navegador não conseguiu gerar o hash da senha.' : dbErrorMessage(ex));
 }
});

async function removeRow(t, id){
 const deps = {
  ESPECIALIDADE:[['MEDICO','ESPECIALIDADE_ID','médicos']],
  MEDICO:[['CONSULTA','MEDICO_ID','consultas']],
  PACIENTE:[['CONSULTA','PACIENTE_CPF','consultas'],['EXAME','PACIENTE_CPF','exames'],['USUARIO','PACIENTE_CPF','usuário']],
  TIPO_EXAME:[['EXAME','TIPO_EXAME_ID','exames']],
  LABORATORIO:[['EXAME','LABORATORIO_ID','exames']],
  EXAME:[['RESULTADO_EXAME','EXAME_ID','resultado']]
 }[t] || [];
 for (const [tb, col, txt] of deps) if (data[tb].some(x => String(x[col]) === String(id))) { notify(`Não é possível excluir: existe ${txt} ligado a este registro.`, true); return; }
 const ok = await askConfirm('Excluir registro', t === 'RESULTADO_EXAME' ? 'O resultado será removido e o exame voltará para "Em análise". Deseja continuar?' : 'Deseja excluir este registro? Essa ação não pode ser desfeita.', 'Excluir');
 if (!ok) return;
 try {
  const old = find(t, id);
  await deleteRow(t, id);
  if (t === 'RESULTADO_EXAME' && old) { const ex = find('EXAME', old.EXAME_ID); if (ex && ex.SITUACAO === 'Resultado disponível') await writeRow('EXAME', Object.assign({}, ex, {SITUACAO:'Em análise'})); }
  render(); notify('Registro excluído.');
 } catch (ex) { notify(dbErrorMessage(ex), true); }
}
async function registerReminder(id){
 const c = find('CONSULTA', id); if (!c) return;
 if (!canEdit('CONSULTA')) { notify('Seu perfil não pode registrar lembretes.', true); return; }
 try { await writeRow('CONSULTA', Object.assign({}, c, {DATA_LEMBRETE: nowLocal()})); render(); notify('Contato de lembrete registrado.'); }
 catch (ex) { notify(dbErrorMessage(ex), true); }
}
async function resetLocal(){
 if (!await askConfirm('Restaurar dados', 'Apagar as alterações deste navegador e voltar aos dados fictícios iniciais?', 'Restaurar')) return;
 try { localStorage.removeItem(LOCAL_KEY); } catch {}
 loadLocal(); render(); notify('Dados de exemplo restaurados.');
}

/* ===== Exportação ===== */
async function offerFile(filename, payload){
 const dl = await getDownloads();
 if (dl) {
  try { await dl.save({filename, data: payload}); notify('Arquivo pronto.'); }
  catch (e) { if (e && e.code !== 'declined') notify('Não foi possível baixar o arquivo aqui.', true); }
  return;
 }
 try {
  const blob = payload instanceof Blob ? payload : new Blob([payload]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
 } catch { notify('Não foi possível baixar o arquivo neste ambiente.', true); }
}
function loadXlsx(){
 if (window.XLSX) return Promise.resolve(window.XLSX);
 return new Promise((res, rej) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s); });
}
async function exportXlsx(){
 const btn = $('btnXlsx'); if (btn) { btn.disabled = true; btn.textContent = 'Gerando…'; }
 try {
  const X = await loadXlsx();
  const wb = X.utils.book_new();
  TABLES.forEach(t => {
   const rows = data[t].slice().sort((a,b)=>String(a[PK[t]]).localeCompare(String(b[PK[t]]),undefined,{numeric:true})).map(r => { const o = {}; COLUMNS[t].forEach(c => o[c] = r[c] == null ? '' : (DATETIME_COLS.has(c) ? String(r[c]).replace('T',' ') : r[c])); return o; });
   const ws = X.utils.json_to_sheet(rows, {header: COLUMNS[t]});
   ws['!cols'] = COLUMNS[t].map(c => ({wch: Math.max(c.length + 2, 14)}));
   X.utils.book_append_sheet(wb, ws, t);
  });
  const buf = X.write(wb, {bookType:'xlsx', type:'array'});
  await offerFile('clinica_adolfo_lutz_dados.xlsx', new Blob([buf]));
 } catch { notify('Não foi possível gerar a planilha agora.', true); }
 finally { if (btn) { btn.disabled = false; btn.textContent = '⬇ Baixar planilha .xlsx'; } }
}
function sqlValue(col, v){
 if (v == null || v === '') return 'NULL';
 if (typeof v === 'number') return String(v);
 let s = String(v);
 if (DATETIME_COLS.has(col)) s = s.replace('T',' ') + (s.length === 16 ? ':00' : '');
 if (col === 'HORA_CONSULTA' && s.length === 5) s += ':00';
 return "'" + s.replace(/\\/g,'\\\\').replace(/'/g,"''") + "'";
}
function exportSql(){
 const lines = ['-- Dados exportados do site da Clínica Médica Adolfo Lutz', '-- Gerado em ' + fmtDT(nowLocal()), '-- Rode depois do script do modelo físico (CREATE TABLE).', '', 'USE `clinica_adolfo_lutz`;', ''];
 TABLES.forEach(t => {
  const rows = data[t].slice().sort((a,b)=>String(a[PK[t]]).localeCompare(String(b[PK[t]]),undefined,{numeric:true}));
  if (!rows.length) return;
  lines.push(`INSERT INTO \`${t}\` (${COLUMNS[t].map(c=>'`'+c+'`').join(', ')}) VALUES`);
  lines.push(rows.map(r => '  (' + COLUMNS[t].map(c => sqlValue(c, r[c])).join(', ') + ')').join(',\n') + ';', '');
 });
 offerFile('clinica_adolfo_lutz_inserts.sql', lines.join('\n'));
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeForm(); } });
